<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RiskAssess · Вход (вариант B)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  /* Токены — НЛМК Design System 2.0 (nlmk-group/ds-2.0), согласованы с DESIGN.md проекта.
     Типографика — реальная шкала Typography ds-2.0 (Heading/Subheading/Body/Body1/Body2/Caption). */
  :root{
    --navy-900:#112542;
    --accent-600:#167ffb;
    --accent-500:#008fff;
    --accent-100:#cbe1ff;
    --accent-50:#e8f5ff;
    --ink-900:#001729;
    --ink-700:#4d5d69;
    --ink-600:#66747e;
    --ink-400:#99a2a9;
    --paper-0:#ffffff;
    --canvas:#edeeef;
    --line:#e5e8ea;
    --red-700:#ee1505;
    --red-50:#ffedf0;
    --green-700:#0d932b;
    --green-50:#e5f8e8;
    --logo-blue:#1492ff;

    --font-display:'Golos Text','PT Root UI','Segoe UI',Arial,sans-serif;
    --font-body:'Golos Text','PT Root UI','Segoe UI',Arial,sans-serif;
    --font-mono:'IBM Plex Mono','SFMono-Regular',monospace;

    --shadow-pop:0 20px 50px -20px rgba(0,23,41,.25);
    --shadow-modal:0 24px 60px -16px rgba(0,23,41,.35);
    --radius-card:16px;
    --radius-field:8px;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --canvas:#3c4854; --paper-0:#475363; --line:#56636e;
      --ink-900:#f2f3f4; --ink-700:#ccd1d4; --ink-600:#99a2a9; --ink-400:#7c8993;
      --accent-50:#16233f; --accent-100:#1b3563;
      --green-50:#0f2b1c; --red-50:#301c1d;
      --shadow-pop:0 20px 50px -12px rgba(0,0,0,.6);
      --shadow-modal:0 24px 60px -12px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --canvas:#3c4854; --paper-0:#475363; --line:#56636e;
    --ink-900:#f2f3f4; --ink-700:#ccd1d4; --ink-600:#99a2a9; --ink-400:#7c8993;
    --accent-50:#16233f; --accent-100:#1b3563;
    --green-50:#0f2b1c; --red-50:#301c1d;
    --shadow-pop:0 20px 50px -12px rgba(0,0,0,.6);
    --shadow-modal:0 24px 60px -12px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--canvas); color:var(--ink-900); font-family:var(--font-body);
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }

  .theme-toggle{position:fixed; top:16px; right:16px; width:40px; height:40px; border-radius:50%;
    border:1px solid var(--line); background:var(--paper-0); cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center;}
  .theme-toggle svg{position:absolute; width:20px; height:20px; color:var(--ink-700);
    transition:opacity .25s ease, transform .35s ease;}
  .theme-toggle .icon-sun{opacity:1; transform:rotate(0deg) scale(1);}
  .theme-toggle .icon-moon{opacity:0; transform:rotate(90deg) scale(.5);}
  :root[data-theme="dark"] .theme-toggle .icon-sun{opacity:0; transform:rotate(-90deg) scale(.5);}
  :root[data-theme="dark"] .theme-toggle .icon-moon{opacity:1; transform:rotate(0deg) scale(1);}

  /* Ширина карточки — 400px: стандартный диапазон для логин-форм (~360-440px),
     достаточно места для двухколоночных полей без избыточных пустых полей. */
  .login-card{
    width:100%; max-width:400px; background:var(--paper-0); border:1px solid var(--line);
    border-radius:var(--radius-card); box-shadow:var(--shadow-pop); padding:32px;
  }

  /* лэйбл компании + название системы над «Вход в систему»; разделительная линия
     растянута на всю ширину карточки (выходит за паддинг карточки) */
  .brand{display:flex; align-items:center; justify-content:center; gap:12px;
    padding:0 32px 20px; margin:0 -32px 24px; border-bottom:1px solid var(--line);}
  .brand-mark{width:40px; height:22px; flex-shrink:0;}
  .brand-mark svg{width:100%; height:100%;}
  /* Body1-Bold (16/24, 700) */
  .brand-text .name{font-family:var(--font-display); font-weight:700; font-size:16px; line-height:24px; color:var(--ink-900);}

  /* Heading4 (20/28, 800) */
  h1{font-family:var(--font-display); font-size:20px; line-height:28px; font-weight:800; letter-spacing:-0.1px; text-align:center; margin:0 0 4px;}
  /* Body2 (14/20, 400) */
  .sub{font-size:14px; line-height:20px; color:var(--ink-700); text-align:center; margin:0 0 24px;}

  form{display:flex; flex-direction:column; gap:16px;}
  .row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  .field{display:flex; flex-direction:column; gap:8px;}
  /* Caption-Medium (12/16, 600) */
  .field label{font-size:12px; line-height:16px; font-weight:600; color:var(--ink-600); text-transform:uppercase; letter-spacing:.2px;}
  /* Caption (12/16, 400) */
  .field .hint{font-size:12px; line-height:16px; color:var(--ink-400); font-weight:400; text-transform:none; letter-spacing:0;}

  /* Body2 (14/20, 400) */
  .field input{
    border:1px solid var(--line); border-radius:var(--radius-field); padding:12px 14px;
    font-size:14px; line-height:20px; font-family:inherit; color:var(--ink-900); background:var(--paper-0); width:100%;
  }
  .field input:focus{outline:none; border-color:var(--accent-600); box-shadow:0 0 0 3px var(--accent-100);}
  .field input.err{border-color:var(--red-700);}
  .field .err-msg{font-size:12px; line-height:16px; color:var(--red-700); display:none;}
  .field.invalid .err-msg{display:block;}

  /* Карточки ролей с иконкой сверху и описанием (формат по референсу «Choose Your Role»),
     цвета и иконки — корпоративные ds-2.0 */
  .role-cards{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .role-card{display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px;
    border:1px solid var(--line); border-radius:var(--radius-field); padding:20px 12px; cursor:pointer;
    background:var(--paper-0); transition:border-color .25s ease, background-color .25s ease, box-shadow .25s ease, transform .2s ease;}
  .role-card:hover{border-color:var(--accent-100); transform:translateY(-1px);}
  .role-card-icon{width:44px; height:44px; border-radius:50%; background:var(--accent-50); color:var(--accent-600);
    display:flex; align-items:center; justify-content:center;
    transition:background-color .25s ease, color .25s ease, transform .3s cubic-bezier(.34,1.56,.64,1);}
  .role-card-icon svg{width:22px; height:22px;}
  .role-card-title{font-size:14px; line-height:20px; font-weight:600; color:var(--ink-900);}
  .role-card-desc{font-size:12px; line-height:16px; color:var(--ink-600);}
  .role-card.active{border-color:var(--accent-600); background:var(--accent-50); box-shadow:0 0 0 3px var(--accent-100);}
  .role-card.active .role-card-icon{background:var(--accent-600); color:#fff; transform:scale(1.08);}

  .btn-row{display:flex; gap:12px; margin-top:8px;}
  .reset-row{display:flex; justify-content:center; margin-top:4px;}
  /* Body2-Bold / Body2-Medium (14/20, 700 / 600) */
  .btn{flex:1; display:inline-flex; align-items:center; justify-content:center; gap:7px; white-space:nowrap;
    border-radius:var(--radius-field); padding:12px 15px; font-size:14px; line-height:20px; font-weight:700; border:1px solid transparent;
    background:transparent; color:var(--ink-600); cursor:pointer; font-family:inherit;}
  .btn:hover{border-color:var(--accent-600); color:var(--accent-600);}
  .btn-primary{background:var(--accent-600); border-color:var(--accent-600); color:#fff; flex:2;}
  .btn-primary:hover{background:var(--accent-500); color:#fff;}
  .btn-text{flex:none; font-weight:600; padding:8px 4px;}

  .success{display:none; text-align:center;}
  .success.show{display:block;}
  .success .check{width:52px; height:52px; border-radius:50%; background:var(--green-50); color:var(--green-700);
    display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:26px;}
  @keyframes popIn{from{opacity:0; transform:scale(.5);} to{opacity:1; transform:scale(1);}}
  .success.show .check{animation:popIn .35s cubic-bezier(.34,1.56,.64,1);}
  /* Heading4 (20/28, 800) */
  .success h2{font-size:20px; line-height:28px; font-weight:800; margin:0 0 8px;}
  /* Body2 (14/20, 400) */
  .success p{font-size:14px; line-height:20px; color:var(--ink-600); margin:0 0 24px;}
  .summary{text-align:left; background:var(--canvas); border-radius:var(--radius-field); padding:16px; margin-bottom:16px;}
  .summary div{display:flex; justify-content:space-between; font-size:14px; line-height:20px; padding:4px 0;}
  .summary div span:first-child{color:var(--ink-600);}
  .summary div span:last-child{font-family:var(--font-mono); color:var(--ink-900); font-weight:600;}

  .login-form.hide, .success.hide{display:none;}

  /* модальное окно ввода СПП — открывается поверх страницы, не сдвигая её содержимое */
  /* модальное окно СПП — плавное появление (350/450мс, ease-out) */
  .modal-overlay{position:fixed; inset:0; background:rgba(0,23,41,.45); display:flex; align-items:center;
    justify-content:center; padding:24px; z-index:50; opacity:0; pointer-events:none; transition:opacity .35s ease-out;}
  .modal-overlay.show{opacity:1; pointer-events:auto;}
  .modal-card{width:100%; max-width:340px; background:var(--paper-0); border-radius:var(--radius-card);
    box-shadow:var(--shadow-modal); padding:28px; transform:scale(.94) translateY(10px);
    transition:transform .45s cubic-bezier(.16,1,.3,1);}
  .modal-overlay.show .modal-card{transform:scale(1) translateY(0);}
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}
  /* Subheading3-Medium (20/28, 500) */
  .modal-head span{font-family:var(--font-display); font-size:20px; line-height:28px; font-weight:500; color:var(--ink-900);}
  .modal-close{border:none; background:none; width:28px; height:28px; border-radius:50%; color:var(--ink-400);
    font-size:20px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:background-color .2s ease, color .2s ease, transform .25s ease;}
  .modal-close:hover{background:var(--canvas); color:var(--ink-700); transform:rotate(90deg);}
</style>
</head>
<body>

<button class="theme-toggle" id="themeBtn" type="button" aria-label="Переключить тему">
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.5 12H2M22 12h-2.5M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg>
  <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.4 14.7A8.5 8.5 0 1 1 9.3 3.6a7 7 0 0 0 11.1 11.1z"/></svg>
</button>

<div class="login-card">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 105 57" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="НЛМК"><path fill-rule="evenodd" clip-rule="evenodd" d="M20.7303 19.0532H15.5128V36.6192H20.7303V29.6627H26.2956V36.6192H31.5164V19.0532H26.2956V25.4881H20.7303V19.0532ZM50.1263 36.6192V19.0532H36.7291V28.2701C36.7291 31.7491 36.0337 32.794 33.2518 32.2708V36.6112C36.2075 37.1328 38.8155 36.6112 40.208 34.8725C41.5989 33.3076 41.7728 30.524 41.7728 28.2621V23.2198H45.0746V36.6192H50.1263ZM59.6905 19.0532H54.4745L52.0324 36.6208H56.9022L58.1193 27.23L60.898 36.6192H64.3752L67.1619 27.23L68.3789 36.6192H73.2551L70.821 19.0532H65.6035L62.6478 29.4888L59.6905 19.0532ZM80.3852 19.0532H75.1676L75.1613 36.6192H80.3788V29.4888L85.0748 36.6192H91.3323L84.5532 27.75L91.1728 19.0532H85.4305L80.3852 26.1836V19.0532ZM0.731079 28.2701C0.731079 11.575 21.4258 0.271667 52.7311 0.271667C84.2054 0.271667 104.731 11.575 104.731 28.2701C104.731 44.7865 84.2086 56.2717 52.7311 56.2717C21.4258 56.2717 0.731079 44.7928 0.731079 28.2701ZM3.68997 28.2701C3.68997 43.4018 23.3415 53.662 52.7311 53.662C82.2945 53.662 101.772 43.4018 101.772 28.2701C101.772 12.966 82.2945 2.87977 52.7311 2.87977C23.3383 2.87977 3.68678 12.966 3.68997 28.2701ZM7.64417 28.2707C7.64417 21.9298 11.8809 16.4671 19.7642 12.536C27.6444 8.60642 38.9979 6.31464 52.7312 6.31464C66.462 6.31464 77.8143 8.60563 85.6939 12.5348C93.5766 16.4655 97.8134 21.9281 97.8134 28.2707C97.8134 34.6134 93.5776 40.0764 85.6956 44.0075C77.8167 47.937 66.4644 50.2284 52.7312 50.2284C38.9979 50.2284 27.6444 47.9362 19.7643 44.0063C11.8809 40.0747 7.64417 34.6117 7.64417 28.2707ZM6.64417 28.2707C6.64417 14.5331 25.0786 5.31464 52.7312 5.31464C80.3789 5.31464 98.8134 14.5299 98.8134 28.2707C98.8134 42.0115 80.3837 51.2284 52.7312 51.2284C25.0786 51.2284 6.64417 42.0083 6.64417 28.2707Z" fill="var(--logo-blue)"/></svg>
    </div>
    <div class="brand-text">
      <div class="name">RiskAssess</div>
    </div>
  </div>

  <div class="login-form" id="loginForm">
    <h1>Вход в систему</h1>
    <p class="sub">Укажите себя и роль</p>

    <form id="entryForm" novalidate>
      <div class="row">
        <div class="field" data-field="firstName">
          <label>Имя</label>
          <input type="text" id="firstName" placeholder="Иван" autocomplete="given-name">
          <div class="err-msg">Укажите имя</div>
        </div>
        <div class="field" data-field="lastName">
          <label>Фамилия</label>
          <input type="text" id="lastName" placeholder="Петров" autocomplete="family-name">
          <div class="err-msg">Укажите фамилию</div>
        </div>
      </div>

      <div class="field" data-field="role">
        <label>Роль</label>
        <div class="role-cards" id="roleToggle">
          <div class="role-card" data-value="riskmanager">
            <span class="role-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></span>
            <span class="role-card-title">Риск-менеджер</span>
            <span class="role-card-desc">Ведёт реестр и верифицирует данные</span>
          </div>
          <div class="role-card" data-value="initiator">
            <span class="role-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h13l-3 4 3 4H5"/></svg></span>
            <span class="role-card-title">Инициатор</span>
            <span class="role-card-desc">Предлагает риски по проекту</span>
          </div>
        </div>
        <div class="err-msg">Выберите роль</div>
      </div>
    </form>

    <div class="reset-row">
      <button type="button" class="btn btn-text" id="resetBtn">Очистить</button>
    </div>
  </div>

  <div class="success" id="successPanel">
    <div class="check">✓</div>
    <h2>Добро пожаловать!</h2>
    <p>Вы вошли в RiskAssess</p>
    <div class="summary" id="summaryBox"></div>
    <button class="btn btn-primary" id="changeBtn" style="width:100%">Изменить данные</button>
  </div>
</div>

<div class="modal-overlay" id="sppModalOverlay">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="sppModalTitle">
    <div class="modal-head">
      <span id="sppModalTitle">СПП проекта</span>
      <button type="button" class="modal-close" id="sppModalClose" aria-label="Закрыть">×</button>
    </div>
    <div class="field" data-field="spp">
      <label>СПП проекта <span class="hint">— 6 цифр</span></label>
      <input type="text" id="spp" placeholder="202401" inputmode="numeric" maxlength="6" autocomplete="off">
      <div class="err-msg">СПП должен состоять ровно из 6 цифр</div>
    </div>
    <div class="btn-row">
      <button type="button" class="btn" id="sppCancel">Отмена</button>
      <button type="button" class="btn btn-primary" id="sppSubmit">Войти в систему</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'riskassess_session';
  const roleOpts = document.querySelectorAll('.role-card');
  const firstNameInput = document.getElementById('firstName');
  const lastNameInput = document.getElementById('lastName');
  const sppInput = document.getElementById('spp');
  let selectedRole = '';

  function setFieldError(name, isInvalid){
    const el = document.querySelector(`.field[data-field="${name}"]`);
    if (!el) return;
    el.classList.toggle('invalid', isInvalid);
    const control = el.querySelector('input');
    if (control) control.classList.toggle('err', isInvalid);
  }
  function clearFieldError(name){ setFieldError(name, false); }

  sppInput.addEventListener('input', () => {
    sppInput.value = sppInput.value.replace(/\D/g, '').slice(0, 6);
    if (sppInput.value.length === 6) clearFieldError('spp');
  });

  // модальное окно СПП — фиксированный оверлей, не влияет на раскладку страницы
  const sppModalOverlay = document.getElementById('sppModalOverlay');
  function openSppModal(){
    sppModalOverlay.classList.add('show');
    setTimeout(() => sppInput.focus(), 350);
  }
  function closeSppModal(){
    sppModalOverlay.classList.remove('show');
  }
  document.getElementById('sppModalClose').addEventListener('click', closeSppModal);
  document.getElementById('sppCancel').addEventListener('click', closeSppModal);
  sppModalOverlay.addEventListener('click', (e) => {
    if (e.target === sppModalOverlay) closeSppModal();
  });

  roleOpts.forEach(opt => {
    opt.addEventListener('click', () => {
      const firstName = firstNameInput.value.trim();
      const lastName = lastNameInput.value.trim();
      let ok = true;
      if (!firstName){ setFieldError('firstName', true); ok = false; } else clearFieldError('firstName');
      if (!lastName){ setFieldError('lastName', true); ok = false; } else clearFieldError('lastName');
      if (!ok) return;

      roleOpts.forEach(o => o.classList.remove('active'));
      opt.classList.add('active');
      selectedRole = opt.dataset.value;
      clearFieldError('role');
      openSppModal();
    });
  });

  document.getElementById('sppSubmit').addEventListener('click', () => {
    const spp = sppInput.value.trim();
    if (spp.length !== 6){ setFieldError('spp', true); return; }
    clearFieldError('spp');

    const data = {
      firstName: firstNameInput.value.trim(),
      lastName: lastNameInput.value.trim(),
      role: selectedRole,
      spp,
    };
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (err) {}

    const roleLabel = data.role === 'riskmanager' ? 'Риск-менеджер' : 'Инициатор';
    document.getElementById('summaryBox').innerHTML = `
      <div><span>ФИО</span><span>${data.firstName} ${data.lastName}</span></div>
      <div><span>Роль</span><span>${roleLabel}</span></div>
      <div><span>СПП проекта</span><span>${data.spp}</span></div>
    `;
    closeSppModal();
    document.getElementById('loginForm').classList.add('hide');
    document.getElementById('successPanel').classList.add('show');
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    document.getElementById('entryForm').reset();
    sppInput.value = '';
    roleOpts.forEach(o => o.classList.remove('active'));
    selectedRole = '';
    closeSppModal();
    ['firstName','lastName','role','spp'].forEach(clearFieldError);
  });

  document.getElementById('changeBtn').addEventListener('click', () => {
    document.getElementById('successPanel').classList.remove('show');
    document.getElementById('loginForm').classList.remove('hide');
  });

  // тема — иконка солнца/луны, без текстовой подписи (как переключатель внешнего вида в Apple)
  const themeBtn = document.getElementById('themeBtn');
  const THEME_KEY = 'riskassess-theme';
  function applyTheme(isDark){
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  }
  let storedTheme = null;
  try { storedTheme = localStorage.getItem(THEME_KEY); } catch (err) {}
  applyTheme(storedTheme === 'dark');
  themeBtn.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') !== 'dark';
    applyTheme(isDark);
    try { localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light'); } catch (err) {}
  });

  // восстановление ранее введённых данных (без автооткрытия модального окна)
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (saved){
      firstNameInput.value = saved.firstName || '';
      lastNameInput.value = saved.lastName || '';
      sppInput.value = saved.spp || '';
      if (saved.role){
        selectedRole = saved.role;
        roleOpts.forEach(o => o.classList.toggle('active', o.dataset.value === saved.role));
      }
    }
  } catch (err) {}
</script>
</body>
</html>
